[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parley-agents"
version = "0.1.0"
description = "Broker-agnostic messaging layer that lets AI agents (and humans) on different machines talk in named rooms and wake each other."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TYO Lab" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
tyomq = ["tyo-mq-client>=0.3.0"]
redis = ["redis>=5.0"]
nats = ["nats-py>=2.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
parley = "parley.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
